name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: scripts/build-release "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # On the homelab ARC runner: the registry and its bucket are LAN-only. The OpenBao login's SPIFFE ID
  # (…/terraform-provider-homelab/release) comes from spire-identity-exchange; its SPIRE entry
  # (homelab-infra platform/spire/github-ci.yaml) matches only this file on a pushed tag.
  release:
    needs: build
    runs-on: homelab
    permissions:
      contents: read
      id-token: write   # GitHub OIDC token, one half of the exchange's proof
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: ddupan/ci-actions/spiffe-openbao-login@v1
        with:
          role: ci-terraform-registry-publisher
      - run: scripts/release "${GITHUB_REF_NAME#v}" dist
