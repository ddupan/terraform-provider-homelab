name: release

on:
  push:
    tags: ['v*']

jobs:
  # The job key is part of the SPIFFE ID (…/terraform-provider-homelab/release) that OpenBao role
  # ci-terraform-registry-publisher accepts; do not rename it.
  release:
    runs-on: [self-hosted, pod]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: scripts/release "${GITHUB_REF_NAME#v}"
