name: release

on:
  push:
    tags: ['v*']

jobs:
  # The job key is part of the SPIFFE ID (…/terraform-provider-homelab/release) that OpenBao role
  # ci-terraform-registry-publisher accepts; do not rename it.
  release:
    runs-on: [self-hosted, pod]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: https://git.ddupan.top/panxiao81/ci-actions/setup-artifact-keeper@d4d8f283dfadac168abc9c7b30036b34d9125fdb # v1
        with:
          go: 'true'
          go-version-file: go.mod
      - run: go test ./...
      - run: scripts/release "${GITHUB_REF_NAME#v}"
