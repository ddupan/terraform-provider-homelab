name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    # Shared Kubernetes pod pool (gitea-dynamic-runner); action versions pinned as in Ayatori.
    runs-on: [self-hosted, pod]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: https://git.ddupan.top/panxiao81/ci-actions/setup-artifact-keeper@d4d8f283dfadac168abc9c7b30036b34d9125fdb # v1
        with:
          go: 'true'
          go-version-file: go.mod
      - name: Module is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /dev/null .
